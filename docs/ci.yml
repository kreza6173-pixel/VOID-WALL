name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.13', cache-provider: basic }
      - name: Install Android SDK 36
        run: |
          SDKMGR="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses
          yes | "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build debug
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: void-wall-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
